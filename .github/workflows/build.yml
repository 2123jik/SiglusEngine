name: Build DLL
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Install MinHook via vcpkg
        run: vcpkg install minhook:x86-windows-static
      - name: Compile DLL
        run: |
          cl.exe /O2 /LD /Fe:version.dll dllmain.cpp /I"C:\vcpkg\installed\x86-windows-static\include" /link /LIBPATH:"C:\vcpkg\installed\x86-windows-static\lib" minhook.lib user32.lib advapi32.lib
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: version-dll
          path: version.dll
